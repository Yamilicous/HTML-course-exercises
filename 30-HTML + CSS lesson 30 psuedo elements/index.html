<!DOCTYPE html>
<html>
  <head>
    <meta char="UTF8">
    <meta viewport content="width=device-width, initial-scale=1.0">
    <title>Psuedo Elements</title>
    <link rel="stylesheet" href="style.css">
  </head>
       
   <!--
      Psuedo elements are elements that are not part of the HTML document. They are used to style specific parts of an element.
      They are defined using double colons (::) followed by the name of the psuedo element
      EX:
      ::first-letter - styles the first letter of an element
      ::first-line - styles the first line of an element
      ::before - inserts content before an element
      ::after - inserts content after an element
      ::selection - styles the portion of an element that is selected by the user
   -->

  <body>
    <h1>Eat me</h1>
   
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptate rem repellat aliquam, dicta exercitationem sunt doloribus culpa? Saepe fugit voluptate, delectus impedit expedita quisquam modi repellendus, consequatur, molestias perspiciatis nemo.</p>
   
    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ul>

    
  </body>
</html>
