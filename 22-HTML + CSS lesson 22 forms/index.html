<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <form action="index.php" method:="POST" enctype="multipart/form-data">
      <label for="name">Username:</label>
      <input type="text" id="name" required minlength="3" maxlength="15" placeholder="Scinoe"><br>

      <label for="pass">Password:</label>
      <input type="password" id="pass" required minlength="8"><br>

      <label for="email">Email:</label>
      <input type="email" id="email" required placeholder="ttqmalaki@gmail.com"><br>

      <label for="phone">Phone:</label>
      <input type="tel" id="phone" required pattern="[0-9]{4}-[0-9]{3}-[0-9]{4}" placeholder="1234-567-8990"><br>
      
      <label for="quantity">Quantity:</label>
      <input type="number" id="quantity" required min="0" max="2" value="1"><br>

      <label for="gender">Gender:</label>
      <input type="radio" id="male" name="gender" value="male">
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="female">
      <label for="female">Female</label><br>

      <label for="payment">Payment:</label>
      <select id="payment" required>
            <option value="Gcash">Gcash</option>
            <option value="Cash on Delivery">Cash on Delivery</option>
            <option value="Credit Card">Credit Card</option>
      </select><br>

      <label for="subscribe">Subscribe</label>
      <input type="checkbox" id="subscribe"><br>
        
      <label for="date">Date:</label>
      <input type="date" id="date" required><br>
      
      <label for="time">Time:</label>
      <input type="time" id="time" required><br>
      
      <label for="file">File:</label>
      <input type="file" id="file" required accept="image/png, image/jpeg, image/webm"><br>
   
      <label for="comment">Comments:</label>
      <textarea id="comment"></textarea><br>

      <input type="reset"><br>
      <input type="submit">

      
  </body>
</html>
